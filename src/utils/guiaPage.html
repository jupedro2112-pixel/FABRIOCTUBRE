<!doctype html>
<html lang="es" data-guide="__GUIDE__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>__TITLE__ · PICA ROJA</title>
<link rel="icon" href="/icons/icon-96x96.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: barra de herramientas fija arriba (guía · buscador · tema) y una columna de lectura de ~70ch con tarjetas por tema */
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);
  --bg:#f6f4f4; --surface:#ffffff; --fg:#1c1718; --muted:#6c6164; --line:#e6dfe0;
  --red:#d9002a; --red-soft:#fde8ec; --mark:#ffe58a; --ok:#137a3a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141112; --surface:#1e1a1b; --fg:#f2ecec; --muted:#a99ea1; --line:#342d2f;
  --red:#ff4d6a; --red-soft:#3a1a21; --mark:#7a5d00; --ok:#56c97f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141112; --surface:#1e1a1b; --fg:#f2ecec; --muted:#a99ea1; --line:#342d2f;
  --red:#ff4d6a; --red-soft:#3a1a21; --mark:#7a5d00; --ok:#56c97f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:800 22px/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{color:var(--red)}
.brand small{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:700 13.5px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.tools{display:grid;grid-template-columns:1fr minmax(0,240px);gap:8px}
@media (max-width:560px){.tools{grid-template-columns:1fr}}
.field{position:relative;min-width:0}
.field input,.field select{width:100%;font:500 15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.field input{padding-left:36px}
.field svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}
.field input:focus,.field select:focus,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.status{color:var(--muted);font-size:13px;min-height:1.2em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 12.5px var(--f-body);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--red);color:var(--red)}
main .wrap{padding-block:18px 40px;display:grid;gap:12px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;scroll-margin-top:190px}
.sec h2{font:800 18px/1.2 var(--f-display);margin:0 0 8px;text-wrap:balance;display:flex;gap:8px;align-items:baseline}
.sec h2 .tag{font:700 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--red);background:var(--red-soft);padding:2px 7px;border-radius:6px}
.sec p{margin:6px 0;max-width:70ch}
.sec ul,.sec ol{margin:6px 0;padding-left:20px;max-width:70ch}
.sec li{margin:3px 0}
.sec .lead{color:var(--muted)}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font:700 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-weight:700}
.note{border-left:3px solid var(--red);background:var(--red-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0}
.num{font-variant-numeric:tabular-nums}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty b{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.sec{transition:border-color .15s}}
.sec.hit{border-color:var(--red)}
</style>
</head><body>
<header class="bar">
  <div class="wrap">
    <div class="brand"><h1>Guía <b>PICA ROJA</b></h1><small id="asof">Actualizada al 23/10/2026 · versión v600</small></div>
    <div class="seg" role="group" aria-label="Elegí la guía">
      <button type="button" id="gSoporte" aria-pressed="true" data-g="soporte">Agente de soporte</button>
      <button type="button" id="gEncargado" aria-pressed="false" data-g="encargado">Encargado</button>
    </div>
    <div class="tools">
      <label class="field" for="q"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Buscá una palabra: rollover, retiro, SMS…" autocomplete="off" aria-label="Buscar en la guía"></label>
      <label class="field" for="topic"><select id="topic" aria-label="Elegí un tema"></select></label>
    </div>
    <div class="chips" id="chips" aria-label="Búsquedas frecuentes"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</header>

<main><div class="wrap" id="list"><div class="empty">Cargando la guía…</div></div></main>
<script>
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const $ = (id) => document.getElementById(id);
let S = [], CHIPS = { soporte: [], encargado: [] };
let guide = document.documentElement.dataset.guide === 'encargado' ? 'encargado' : 'soporte';

function highlight(node, q) {
  if (!q) return;
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT); const hits = [];
  while (walker.nextNode()) hits.push(walker.currentNode);
  for (const tn of hits) {
    const raw = tn.nodeValue, n = norm(raw); let i = n.indexOf(q); if (i < 0) continue;
    const frag = document.createDocumentFragment(); let last = 0;
    while (i >= 0) { frag.append(raw.slice(last, i)); const m = document.createElement('mark'); m.textContent = raw.slice(i, i + q.length); frag.append(m); last = i + q.length; i = n.indexOf(q, last); }
    frag.append(raw.slice(last)); tn.parentNode.replaceChild(frag, tn);
  }
}
function render() {
  const q = norm($('q').value.trim()); const sel = $('topic').value;
  const list = $('list'); list.innerHTML = '';
  const items = S.filter((s) => s.g === guide && (!sel || s.id === sel));
  let shown = 0;
  for (const s of items) {
    const el = document.createElement('section'); el.className = 'sec'; el.id = 's-' + s.id;
    el.innerHTML = '<h2>' + s.t + (s.tag ? ' <span class="tag">' + s.tag + '</span>' : '') + '</h2>' + s.h;
    if (q) { if (!norm(el.textContent).includes(q)) continue; highlight(el, q); el.classList.add('hit'); }
    list.appendChild(el); shown++;
  }
  if (!shown) list.innerHTML = '<div class="empty">No hay resultados para <b>“' + $('q').value.replace(/[<>&]/g, '') + '”</b>. Probá con otra palabra o elegí “Todos los temas”.</div>';
  $('status').textContent = q ? (shown + (shown === 1 ? ' tema' : ' temas') + ' con “' + $('q').value.trim() + '”') : (sel ? '' : items.length + ' temas en esta guía');
}
function fillTopics() {
  const t = $('topic'); t.innerHTML = '<option value="">Todos los temas</option>' + S.filter((s) => s.g === guide).map((s) => '<option value="' + s.id + '">' + s.t + '</option>').join('');
  $('chips').innerHTML = CHIPS[guide].map((c) => '<button type="button" class="chip">' + c + '</button>').join('');
}
function setGuide(g) {
  guide = g; document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.g === g)));
  fillTopics(); render();
}
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { $('q').value = ''; setGuide(b.dataset.g); }));
$('q').addEventListener('input', () => { $('topic').value = ''; render(); });
$('topic').addEventListener('change', () => { $('q').value = ''; render(); window.scrollTo({ top: 0 }); });
$('chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; $('q').value = b.textContent; $('topic').value = ''; render(); });
// #894: el contenido lo manda el servidor sólo con la sesión del panel (cookie del panel o token guardado por el panel).
(async function boot() {
  const box = $('list');
  try {
    const r = await fetch('/api/admin/guia?g=' + guide, { credentials: 'include' });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 || r.status === 403) {
      document.querySelector('.tools').hidden = true; $('chips').hidden = true; document.querySelector('.seg').hidden = true;
      box.innerHTML = '<div class="empty"><b>' + (r.status === 403 ? 'Esta guía es sólo para el administrador general.' : 'Entrá al panel con tu usuario para ver la guía.') + '</b><br><br><a class="chip" href="/adminprivado2026/">Ir al panel</a><br><br>Después volvé a abrir este link en el mismo navegador.</div>';
      $('status').textContent = ''; return;
    }
    if (!r.ok) throw new Error(j.error || 'error');
    S = j.sections || []; CHIPS = j.chips || CHIPS;
    if (!j.canEncargado) { const b = document.querySelector('[data-g="encargado"]'); if (b) b.hidden = true; }
    setGuide(guide);
  } catch (e) { box.innerHTML = '<div class="empty">No se pudo cargar la guía. Revisá la conexión y recargá la página.</div>'; }
})();
</script>
</body></html>
